{% extends "base.html" %}
{% block content %}
<h1>Create an account</h1>

<form method="post" action="{% url 'signup' %}" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}              {# draws all 4 boxes from SignUpForm #}
  <button type="submit">Sign up</button>
</form>
{% endblock %}
