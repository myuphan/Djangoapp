{% extends "base.html"%}
{% block content%}
<h1>Forgot your password</h1>
<p>Enter your email and we'll send you a reset link</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button> <!--trigger and submit what inside the form-->
</form>
<p><a href="{% url 'login' %}">Back to log in</a></p>
{% endblock %}
